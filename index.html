<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8E1F1F">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>芋煮会ビンゴ 採点</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Shippori+Mincho+B1:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7EFDF; --card:#FFFCF5; --ink:#2B2320; --sub:#7A6A55; --line:#E2D3B5;
  --gold:#C8922A; --red:#8E1F1F; --green:#4F6B3A; --glow:#F2D9A0;
  --font:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --stamp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
}
html{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-weight:500;font-size:16px;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:3px solid var(--gold);padding:10px 16px 8px;display:flex;align-items:center;gap:10px}
.top h1{font-size:19px;font-weight:900;letter-spacing:.04em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{font-size:15px;font-weight:700;color:var(--red);padding:6px 4px;min-height:40px}
.saved{font-size:12px;color:var(--green);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
main{flex:1;padding:16px 16px 120px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{padding:12px 0 14px;font-size:14px;font-weight:700;color:var(--sub);border-top:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--red);border-top-color:var(--red)}

/* team list */
.team{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:6px;padding:14px;margin-bottom:10px}
.team .nm{flex:1;min-width:0}
.team .nm b{display:block;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .nm small{color:var(--sub);font-size:13px}
.team .pt{font-size:26px;font-weight:900;color:var(--red);font-variant-numeric:tabular-nums}
.team .pt span{font-size:13px;margin-left:2px}
.primary{display:block;width:100%;background:var(--red);color:#fff;font-weight:700;font-size:16px;border-radius:6px;padding:14px;margin-top:6px}
.ghost{display:block;width:100%;border:1.5px solid var(--line);border-radius:6px;padding:12px;font-weight:700;color:var(--sub);margin-top:10px}
.danger{color:var(--red);border-color:var(--red)}
.empty{text-align:center;color:var(--sub);padding:40px 12px 20px}

/* editor */
.namebox{width:100%;font-size:20px;font-weight:700;background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:10px 12px}
.label{font-size:14px;font-weight:700;color:var(--green);margin:20px 0 8px;display:flex;justify-content:space-between}
.label span{color:var(--sub);font-weight:500}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cell{position:relative;aspect-ratio:1/1.05;background:var(--card);border:1.5px solid var(--line);border-radius:5px;padding:14px 2px 2px;font-size:11px;font-weight:700;line-height:1.2;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-line;transition:background .2s,border-color .2s}
.cell .tx{position:relative;z-index:1}
.cell .no{position:absolute;top:2px;left:4px;font-size:10px;color:var(--gold);font-weight:700}
.cell.line{background:var(--glow);border-color:var(--gold)}
.cell .hanko{position:absolute;inset:0;margin:auto;width:78%;aspect-ratio:1;border:2.5px solid var(--red);border-radius:50%;color:var(--red);font-family:var(--stamp);font-size:clamp(20px,7vw,34px);font-weight:800;display:flex;align-items:center;justify-content:center;opacity:.38;transform:rotate(-12deg);pointer-events:none;z-index:0}
.cell[aria-pressed="true"] .tx{color:var(--red)}
.cell.pop .hanko{animation:stamp .28s ease-out}
@keyframes stamp{0%{transform:rotate(-12deg) scale(1.6);opacity:0}70%{transform:rotate(-12deg) scale(.94);opacity:.6}100%{transform:rotate(-12deg) scale(1);opacity:.38}}
@media (prefers-reduced-motion: reduce){.cell.pop .hanko{animation:none}}
.chips{display:grid;gap:8px}
.chip{display:flex;gap:8px;align-items:center;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;font-weight:700;text-align:left}
.chip em{margin-left:auto;font-style:normal;color:var(--sub);font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--card))}
.chip[aria-pressed="true"]::after{content:"受賞";order:3;color:#fff;background:var(--red);font-size:12px;border-radius:3px;padding:1px 7px;margin-left:8px}
.chip[aria-pressed="true"] em{color:var(--red)}
textarea{width:100%;min-height:80px;background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:10px;font-size:15px}

.total{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--red);color:#fff}
.total div{max-width:560px;margin:0 auto;padding:8px 16px;display:flex;align-items:baseline;gap:12px}
.total small{flex:1;font-size:12px;line-height:1.4;opacity:.9}
.total b{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.total b span{font-size:14px;margin-left:2px}

/* ranking */
.rank{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:8px}
.rank .r{font-size:22px;font-weight:900;text-align:center;color:var(--sub)}
.rank.top1 .r,.rank.top2 .r,.rank.top3 .r{color:var(--red)}
.rank.top1{border:2px solid var(--gold)}
.rank b{font-size:16px;display:block}
.rank small{color:var(--sub);font-size:12.5px}
.rank .pt{font-size:22px;font-weight:900;color:var(--red);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--sub);margin-top:12px}

dialog{margin:auto;border:0;border-radius:8px;padding:20px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(30,20,10,.5)}
dialog h2{font-size:17px;margin-bottom:10px}
dialog p{font-size:14px;color:var(--sub);margin-bottom:12px;white-space:pre-line}
dialog .row{display:flex;gap:8px;margin-top:14px}
dialog .row button{flex:1;padding:12px;border-radius:6px;font-weight:700;border:1.5px solid var(--line)}
dialog .row .ok{background:var(--red);border-color:var(--red);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:20px;font-size:14px;white-space:nowrap;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* help */
.help h2{font-size:16px;font-weight:900;margin:24px 0 8px;padding-left:10px;border-left:4px solid var(--gold)}
.help h2:first-child{margin-top:4px}
.help p,.help li{font-size:14.5px;line-height:1.75}
.help ol,.help ul{padding-left:1.4em}
.help li{margin-bottom:4px}
.help .ui{display:inline-block;font-weight:700;font-size:13px;padding:0 7px;border-radius:4px;background:var(--red);color:#fff;white-space:nowrap}
.help .ui.tab{background:var(--card);color:var(--red);border:1px solid var(--line)}
.help .alert{background:var(--card);border:2px solid var(--red);border-radius:6px;padding:12px 14px;margin:10px 0}
.help .alert b{color:var(--red)}
.help .mini{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;border-radius:4px;vertical-align:middle;margin:0 2px;font-size:10px;font-weight:700;position:relative;border:1.5px solid var(--line);background:var(--card)}
.help .mini.on::after{content:"済";position:absolute;inset:3px;border:1.5px solid var(--red);border-radius:50%;color:var(--red);font-family:var(--stamp);font-size:13px;display:flex;align-items:center;justify-content:center;opacity:.5;transform:rotate(-12deg)}
.help .mini.gl{background:var(--glow);border-color:var(--gold)}
.help table{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}
.help td{border-bottom:1px solid var(--line);padding:6px 4px}
.help td:last-child{text-align:right;font-weight:700;color:var(--red);white-space:nowrap}
.linkbtn{color:var(--red);font-weight:700;text-decoration:underline}
</style>
</head>
<body>
<div class="app">
  <header class="top"><button class="back" id="back" hidden>‹ 一覧</button><h1 id="title">芋煮会ビンゴ 採点</h1><span class="saved" id="saved">保存しました</span></header>
  <main id="main"></main>
</div>
<div class="total" id="total" hidden><div><small id="breakdown"></small><b id="sum">0<span>点</span></b></div></div>
<nav class="tabs"><div>
  <button data-tab="list">チーム</button><button data-tab="rank">ランキング</button><button data-tab="data">データ</button><button data-tab="help">使い方</button>
</div></nav>
<dialog id="dlg"><h2 id="dlgT"></h2><p id="dlgP"></p><div id="dlgBody"></div><div class="row"><button id="dlgNo">キャンセル</button><button class="ok" id="dlgOk">OK</button></div></dialog>
<div class="toast" id="toast"></div>

<script>
"use strict";
const TOPICS=["どんぐり","カモシカ","展望台","水車","松ぼっ\nくり","社長","会社の\nロゴに\n似ている\nもの","ハート\nの石","とんぼ","ジャンボ\nローラー","大きな岩","紫の花","集合\n写真","木漏れ日","2026年\n入社の人","足跡","データ\nコムの\nDの形を\n作る","他チーム\nの人","写真で\n一句","池","キノコ","面白い\nポーズで\n写真・\n動画","鳥","おしゃれ\nな人","黄色い\n葉っぱ"];
const AWARDS=[{k:"best",n:"ベストフォト賞",p:20},{k:"funny",n:"面白写真賞",p:10},{k:"team",n:"チームワーク賞",p:10}];
const LINES=[];
for(let i=0;i<5;i++){LINES.push([0,1,2,3,4].map(j=>i*5+j));LINES.push([0,1,2,3,4].map(j=>j*5+i));}
LINES.push([0,6,12,18,24],[4,8,12,16,20]);
const KEY="imoni-bingo-2026";

/* ---------- storage ---------- */
let state={teams:[]};
function load(){try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(Array.isArray(d.teams))state=d;}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));flashSaved();return true;}catch(e){toast("保存できませんでした（ブラウザの設定を確認してください）");return false;}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function newTeam(name){return{id:uid(),name,cells:Array(25).fill(false),awards:{best:false,funny:false,team:false},memo:"",updated:Date.now()};}

/* ---------- scoring ---------- */
function score(t){
  const cnt=t.cells.filter(Boolean).length;
  const done=LINES.filter(l=>l.every(i=>t.cells[i]));
  const lineIdx=new Set(done.flat());
  const bingo=done.length*10, full=cnt===25?30:0;
  const award=AWARDS.reduce((s,a)=>s+(t.awards[a.k]?a.p:0),0);
  return{cnt,lines:done.length,lineIdx,bingo,full,award,total:bingo+full+award};
}
function ranked(){
  const arr=state.teams.map(t=>({t,s:score(t)})).sort((a,b)=>b.s.total-a.s.total||b.s.cnt-a.s.cnt);
  let r=0,prev=null;
  arr.forEach((x,i)=>{const k=x.s.total+"/"+x.s.cnt;if(k!==prev){r=i+1;prev=k;}x.rank=r;});
  return arr;
}

/* ---------- ui helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let savedTimer,toastTimer;
function flashSaved(){const e=$("#saved");e.classList.add("on");clearTimeout(savedTimer);savedTimer=setTimeout(()=>e.classList.remove("on"),1200);}
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove("on"),2200);}
function ask({title,text="",body="",ok="OK",cancel=true}){
  return new Promise(res=>{
    const d=$("#dlg");$("#dlgT").textContent=title;$("#dlgP").textContent=text;$("#dlgBody").innerHTML=body;
    $("#dlgOk").textContent=ok;$("#dlgNo").hidden=!cancel;
    const done=v=>{d.close();res(v);};
    $("#dlgOk").onclick=()=>done(true);$("#dlgNo").onclick=()=>done(false);d.oncancel=e=>{e.preventDefault();done(false);};
    d.showModal();const f=d.querySelector("input,textarea");if(f)f.focus();
  });
}

/* ---------- routing ---------- */
let view={tab:"list",team:null};
function go(v){view=v;render();window.scrollTo(0,0);}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>go({tab:b.dataset.tab,team:null}));
$("#back").onclick=()=>go({tab:"list",team:null});

function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===view.tab?"page":"false"));
  const t=view.team&&state.teams.find(x=>x.id===view.team);
  $("#back").hidden=!t;$("#total").hidden=!t;
  if(t)return renderEditor(t);
  $("#title").textContent={list:"芋煮会ビンゴ 採点",rank:"ランキング",data:"データの受け渡し",help:"使い方"}[view.tab];
  ({list:renderList,rank:renderRank,data:renderData,help:renderHelp})[view.tab]();
}

/* ---------- list ---------- */
function renderList(){
  const m=$("#main");
  const items=state.teams.map(t=>{const s=score(t);return`<button class="team" data-id="${t.id}"><span class="nm"><b>${esc(t.name)}</b><small>${s.cnt}/25マス　ビンゴ${s.lines}列</small></span><span class="pt">${s.total}<span>点</span></span></button>`;}).join("");
  m.innerHTML=(items||`<p class="empty">まだチームがありません。<br>担当するチームを作成してください。<br><br>はじめて使うときは <button class="linkbtn" id="toHelp">使い方</button> を読んでください。</p>`)+`<button class="primary" id="add">＋ チームを作成</button>`;
  m.querySelectorAll(".team").forEach(b=>b.onclick=()=>go({tab:"list",team:b.dataset.id}));
  $("#add").onclick=addTeam;
  const h=$("#toHelp");if(h)h.onclick=()=>go({tab:"help",team:null});
}
async function addTeam(){
  const n=state.teams.length+1;
  const ok=await ask({title:"チームを作成",body:`<input class="namebox" id="nn" placeholder="例：チーム${n}" maxlength="30">`,ok:"作成"});
  if(!ok)return;
  const name=($("#nn").value||"").trim()||`チーム${n}`;
  const t=newTeam(name);state.teams.push(t);save();go({tab:"list",team:t.id});
}

/* ---------- editor ---------- */
function renderEditor(t){
  $("#title").textContent=t.name;
  const m=$("#main");
  m.innerHTML=`
  <input class="namebox" id="tname" value="${esc(t.name)}" maxlength="30" aria-label="チーム名">
  <p class="label">達成したマスをタップ<span id="cnt"></span></p>
  <div class="board" id="board">${TOPICS.map((x,i)=>`<button class="cell" data-i="${i}" aria-pressed="false"><span class="no">${i+1}</span><span class="tx">${esc(x)}</span></button>`).join("")}</div>
  <p class="label">各賞</p>
  <div class="chips">${AWARDS.map(a=>`<button class="chip" data-k="${a.k}" aria-pressed="${t.awards[a.k]}">${a.n}<em>+${a.p}点</em></button>`).join("")}</div>
  <p class="label">メモ</p>
  <textarea id="memo" placeholder="写真の感想・確認事項など">${esc(t.memo)}</textarea>
  <button class="ghost danger" id="del">このチームを削除</button>`;
  const touch=()=>{t.updated=Date.now();save();};
  $("#tname").onchange=e=>{t.name=e.target.value.trim()||t.name;e.target.value=t.name;$("#title").textContent=t.name;touch();};
  $("#memo").onchange=e=>{t.memo=e.target.value;touch();};
  m.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{
    const i=+c.dataset.i;t.cells[i]=!t.cells[i];touch();paint(t,t.cells[i]?i:null);
  });
  m.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    const k=c.dataset.k;t.awards[k]=!t.awards[k];c.setAttribute("aria-pressed",t.awards[k]);touch();paint(t);
  });
  $("#del").onclick=async()=>{
    if(await ask({title:"チームを削除",text:`「${t.name}」の採点データを削除します。\n元に戻せません。`,ok:"削除する"})){
      state.teams=state.teams.filter(x=>x.id!==t.id);save();toast("削除しました");go({tab:"list",team:null});
    }
  };
  paint(t);
}
function paint(t,popped=null){
  const s=score(t);
  document.querySelectorAll(".cell").forEach(c=>{
    const i=+c.dataset.i,on=t.cells[i];
    c.setAttribute("aria-pressed",on);
    c.classList.toggle("line",s.lineIdx.has(i));
    let h=c.querySelector(".hanko");
    if(on&&!h){h=document.createElement("span");h.className="hanko";h.textContent="済";c.appendChild(h);}
    if(!on&&h)h.remove();
    c.classList.toggle("pop",i===popped);
  });
  $("#cnt").textContent=`${s.cnt}/25マス　ビンゴ${s.lines}列`;
  const aw=AWARDS.filter(a=>t.awards[a.k]).map(a=>a.n.replace("賞","")).join("・");
  $("#breakdown").innerHTML=`ビンゴ ${s.lines}列 ${s.bingo}点${s.full?"　全マス 30点":""}<br>賞 ${s.award}点${aw?"（"+esc(aw)+"）":""}`;
  $("#sum").innerHTML=`${s.total}<span>点</span>`;
}

/* ---------- ranking ---------- */
function renderRank(){
  const m=$("#main"),arr=ranked();
  if(!arr.length){m.innerHTML=`<p class="empty">チームを作成すると、ここに順位が表示されます。</p>`;return;}
  m.innerHTML=arr.map(x=>{
    const aw=AWARDS.filter(a=>x.t.awards[a.k]).map(a=>a.n).join("・");
    return`<div class="rank${x.rank<=3?" top"+x.rank:""}"><span class="r">${x.rank}</span><span><b>${esc(x.t.name)}</b><small>${x.s.cnt}マス／ビンゴ${x.s.lines}列${x.s.full?"／全マス":""}${aw?"<br>"+esc(aw):""}</small></span><span class="pt">${x.s.total}</span></div>`;
  }).join("")+`<p class="note">この端末にあるチームだけを表示しています。もう1台で採点したチームは、<button class="linkbtn" id="toData">データ</button>タブで取り込むと一緒に並びます。</p><p class="note">同点の場合は達成マス数が多いチームが上位です。マス数も同じなら同順位になります。</p>`;
  $("#toData").onclick=()=>go({tab:"data",team:null});
}

/* ---------- data transfer ---------- */
function renderData(){
  const m=$("#main");
  m.innerHTML=`
  <p class="label">もう1台へ送る</p>
  <p class="note" style="margin-top:0">この端末の全チームのデータを文字にしてコピーします。LINEなどに貼り付けて送ってください。</p>
  <button class="primary" id="exp">データをコピー</button>
  <p class="label">もう1台から受け取る</p>
  <p class="note" style="margin-top:0">受け取った文字を貼り付けて取り込みます。同じチームは更新が新しいほうが残り、この端末にないチームは追加されます。</p>
  <textarea id="imp" placeholder="ここに貼り付け"></textarea>
  <button class="primary" id="impBtn">取り込む</button>
  <p class="label">リハーサル後などに</p>
  <button class="ghost danger" id="wipe">この端末の全データを削除</button>`;
  $("#exp").onclick=async()=>{
    if(!state.teams.length)return toast("送るチームがありません");
    const txt="IMONI:"+JSON.stringify(state);
    try{await navigator.clipboard.writeText(txt);toast(`${state.teams.length}チーム分をコピーしました`);}
    catch(e){await ask({title:"下の文字を長押しでコピー",body:`<textarea readonly style="min-height:140px">${esc(txt)}</textarea>`,cancel:false});}
  };
  $("#impBtn").onclick=async()=>{
    let raw=$("#imp").value.trim();
    if(raw.startsWith("IMONI:"))raw=raw.slice(6);
    let d;try{d=JSON.parse(raw);}catch(e){return toast("読み込めません。コピーした文字を全部貼り付けてください");}
    if(!d||!Array.isArray(d.teams))return toast("採点データの形式ではありません");
    let add=0,upd=0,keep=0;
    for(const t of d.teams){
      if(!t||!t.id||!Array.isArray(t.cells)||t.cells.length!==25)continue;
      const cur=state.teams.find(x=>x.id===t.id);
      const clean={id:String(t.id),name:String(t.name||"無名チーム").slice(0,30),cells:t.cells.map(Boolean),awards:{best:!!t.awards?.best,funny:!!t.awards?.funny,team:!!t.awards?.team},memo:String(t.memo||""),updated:+t.updated||0};
      if(!cur){state.teams.push(clean);add++;}
      else if(clean.updated>cur.updated){Object.assign(cur,clean);upd++;}
      else keep++;
    }
    save();$("#imp").value="";
    toast(`追加${add}・更新${upd}・変更なし${keep}`);
  };
  $("#wipe").onclick=async()=>{
    if(await ask({title:"全データを削除",text:`この端末の${state.teams.length}チーム分を削除します。\n元に戻せません。`,ok:"削除する"})){
      state={teams:[]};save();toast("全データを削除しました");render();
    }
  };
}
